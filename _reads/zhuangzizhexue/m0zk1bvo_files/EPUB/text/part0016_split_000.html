  <p class="copyright-bodytext">相对于形体的“实”，心是可以虚的，而且这应该是它的本性。</p>

  <p class="copyright-bodytext">心的虚无的本性决定了它可以摆脱有形物，包括形体的限制，而且它应该摆脱这种限制。但是这种摆脱是以承认形体的有限性以及形体属于命运的世界为前提的。在这种承认中，心由于部分地让渡出对形体的执著，因而获得了某种限度的自由。形体不足以成为对心的限制，换言之，不足以在心中打结。</p>
