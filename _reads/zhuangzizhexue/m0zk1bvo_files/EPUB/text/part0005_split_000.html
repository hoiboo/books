  <p class="copyright-bodytext">庄子哲学中最重要的问题就是生命的问题。</p>

  <p class="copyright-bodytext">庄子思考的主要是生命在乱世中的安顿。他不是不关心秩序，可是觉得这问题非他所能关怀，或者只有在安顿生命之后才能关怀，于是就选择放弃，或者说暂时的放弃。这种放弃的态度使他可以不必殚精竭虑地进入这个世界，从而可以与世界保持适当的距离。</p>
