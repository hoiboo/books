  <p class="copyright-bodytext">对于一个追求中庸和适度的民族来说，狂的魅力有时是无法言说的。</p>

  <p class="copyright-bodytext">“我本楚狂人，凤歌笑孔丘”，似乎不仅是李白个人的自白。放歌纵酒，也不只是魏晋名士风流的影子。而他们都可以让我们想起另一个人，那就是庄子。</p>

  <p class="copyright-bodytext">其实就是狂。在一个虚伪的扭曲的社会中，真人往往被视为狂人。</p>

  <p class="copyright-bodytext">一般人是游于方之内的，而庄子则游于方之外。外内不相及，自内视外，在外的人自然就是狂的。</p>
