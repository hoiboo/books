  <p class="copyright-bodytext">委蛇的状态也就是因顺的状态，彼为形，我即为影；彼为声，我即为响。</p>

  <p class="copyright-bodytext">但这绝不是与混浊的世俗同流合污。</p>

  <p class="copyright-bodytext">形就而不入，也就是形之委蛇。</p>

  <p class="copyright-bodytext">人不能执著于原物，无心以顺有，便是打破了成心造成的隔限，而至于无穷的境地。这样的人就是无待的人，这样的心就是逍遥之心。</p>
