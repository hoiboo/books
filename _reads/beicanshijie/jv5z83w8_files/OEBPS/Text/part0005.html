<h1 id="a006" class="front">作者序</h1>
<p class="block">只要因法律和习俗所造成的社会压迫还存在一天，在文明鼎盛时期人为地把人间变成地狱并使人类与生俱来的幸运遭受不可避免的灾祸；只要本世纪的三个问题——贫穷使男子潦倒，饥饿使妇女堕落，黑暗使儿童羸弱——还得不到解决；只要在某些地区还可能发生社会的毒害，换句话说，同时也是从更广的意义来说，只要这世界上还有愚昧和困苦，那么，和本书同一性质的作品都不会是无益的。</p>
<p class="right">一八六二年一月一日于奥特维尔别馆</p>
